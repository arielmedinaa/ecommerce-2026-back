<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body style="margin:0;padding:0;font-family:'Poppins',Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:24px 32px;border-bottom:1px solid #e5e5e5;">
              <img src="{{logoUrl}}" alt="Central Shop" height="28" style="display:block;" />
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {{content}}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;border-top:1px solid #e5e5e5;color:#8a8a8a;font-size:12px;">
              Central Shop &middot; Este es un correo automático, por favor no respondas a esta dirección.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
