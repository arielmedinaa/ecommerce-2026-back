apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  labels:
    app: nats
data:
  # max_payload 8MB: las respuestas del image-service (banners) superaban el límite
  # default de 1MB → MAX_PAYLOAD_EXCEEDED y crash del pod. Se configura por archivo
  # (nats-server no acepta --max_payload como flag CLI en esta imagen).
  nats.conf: |
    port: 4222
    http_port: 8222
    max_payload: 8MB
    jetstream {
      store_dir: "/tmp/nats/jetstream"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  labels:
    app: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
      - name: nats
        image: nats:2.10-alpine
        # Config por archivo: JetStream + monitoreo (8222) + max_payload 8MB.
        args: ["-c", "/etc/nats/nats.conf"]
        volumeMounts:
        - name: nats-config
          mountPath: /etc/nats
        ports:
        - containerPort: 4222   # cliente
        - containerPort: 8222   # monitoreo HTTP
        readinessProbe:
          tcpSocket:
            port: 4222
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 4222
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
      volumes:
      - name: nats-config
        configMap:
          name: nats-config
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector:
    app: nats
  ports:
  - name: client
    protocol: TCP
    port: 4222
    targetPort: 4222
  - name: monitor
    protocol: TCP
    port: 8222
    targetPort: 8222
  type: ClusterIP
