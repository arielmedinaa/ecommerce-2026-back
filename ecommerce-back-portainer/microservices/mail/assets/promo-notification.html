<h1 style="margin:0 0 8px;font-size:20px;color:#1a1a1a;">{{titulo}}</h1>
<p style="margin:0 0 20px;font-size:14px;color:#4a4a4a;line-height:1.5;">
  Tenemos una nueva promoción disponible para vos.
</p>
<img src="{{bannerImageUrl}}" alt="{{titulo}}" width="416" style="display:block;width:100%;max-width:416px;border-radius:8px;margin-bottom:20px;" />
<table role="presentation" cellpadding="0" cellspacing="0">
  <tr>
    <td style="border-radius:8px;background-color:#f97316;">
      <a href="{{link}}" style="display:inline-block;padding:12px 24px;color:#ffffff;font-size:14px;text-decoration:none;font-weight:bold;">
        Ver promoción
      </a>
    </td>
  </tr>
</table>
