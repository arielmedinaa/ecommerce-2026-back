<h1 style="margin:0 0 8px;font-size:20px;color:#1a1a1a;">Confirmamos tu pedido</h1>
<p style="margin:0 0 4px;font-size:13px;color:#8a8a8a;">Pedido N.º {{codigo}}</p>
<p style="margin:0 0 20px;font-size:14px;color:#4a4a4a;line-height:1.5;">
  Hola {{nombre}}, recibimos tu pedido y ya lo estamos preparando. A continuación el detalle de tu compra.
</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin-bottom:20px;">
  <thead>
    <tr>
      <td style="padding:8px 0;border-bottom:1px solid #e5e5e5;font-size:12px;color:#8a8a8a;">Producto</td>
      <td style="padding:8px 0;border-bottom:1px solid #e5e5e5;font-size:12px;color:#8a8a8a;text-align:center;">Cant.</td>
      <td style="padding:8px 0;border-bottom:1px solid #e5e5e5;font-size:12px;color:#8a8a8a;text-align:right;">Precio</td>
    </tr>
  </thead>
  <tbody>
    {{itemsRows}}
  </tbody>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
  <tr>
    <td style="font-size:14px;color:#1a1a1a;font-weight:bold;">Total</td>
    <td style="font-size:14px;color:#1a1a1a;font-weight:bold;text-align:right;">{{total}}</td>
  </tr>
</table>
<table role="presentation" cellpadding="0" cellspacing="0">
  <tr>
    <td style="border-radius:8px;background-color:#f97316;">
      <a href="{{trackingUrl}}" style="display:inline-block;padding:12px 24px;color:#ffffff;font-size:14px;text-decoration:none;font-weight:bold;">
        Seguir mi pedido
      </a>
    </td>
  </tr>
</table>
